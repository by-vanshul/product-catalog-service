version: '3.9'

services:

  db:
    image: postgres:18

    container_name: product_catalog_db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

  api:
    build: .

    container_name: product_catalog_api

    depends_on:
      - db

    ports:
      - "8000:8000"

    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}